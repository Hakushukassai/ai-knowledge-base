<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>学びの記録 — AI開発ナレッジベース</title>
<style>
  :root{
    --sidebar-bg: rgba(246,246,248,0.8);
    --sidebar-bg-solid: #f5f5f7;
    --list-bg: #fbfbfc;
    --detail-bg: #ffffff;
    --line: rgba(0,0,0,0.09);
    --line-soft: rgba(0,0,0,0.055);
    --text-1: #1d1d1f;
    --text-2: #6e6e73;
    --text-3: #a1a1a6;
    --row-hover: rgba(0,0,0,0.035);
    --row-selected: #dbe9ff;
    --chip-bg: rgba(0,0,0,0.045);
    --chip-active-bg: transparent;
    --chip-active-text: #007aff;
    --input-bg: rgba(0,0,0,0.045);
    --scrollbar: rgba(0,0,0,0.18);

    --cat-rule: #6f8a76;
    --cat-candidate: #a68a5c;
    --cat-incident: #a97b70;
    --cat-archive: #9a9a9f;
    --cat-external: #6f84a6;

    --radius-lg: 14px;
    --radius-md: 10px;
    --radius-sm: 7px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --sidebar-bg: rgba(34,34,36,0.78);
      --sidebar-bg-solid: #1e1e20;
      --list-bg: #19191b;
      --detail-bg: #232325;
      --line: rgba(255,255,255,0.09);
      --line-soft: rgba(255,255,255,0.06);
      --text-1: #f5f5f7;
      --text-2: #98989d;
      --text-3: #6e6e73;
      --row-hover: rgba(255,255,255,0.045);
      --row-selected: #164d8a;
      --chip-bg: rgba(255,255,255,0.075);
      --chip-active-bg: transparent;
      --chip-active-text: #0a84ff;
      --input-bg: rgba(255,255,255,0.075);
      --scrollbar: rgba(255,255,255,0.2);

      --cat-rule: #8fae96;
      --cat-candidate: #c3a97b;
      --cat-incident: #c2938a;
      --cat-archive: #838388;
      --cat-external: #8fa8c9;
    }
  }

  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent;}
  html, body{height:100%;}
  body{
    background: var(--list-bg);
    color: var(--text-1);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button, input{ font-family: inherit; }
  ::selection{ background: var(--row-selected); }

  .pane{ overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--scrollbar) transparent; }
  .pane::-webkit-scrollbar{ width: 9px; }
  .pane::-webkit-scrollbar-thumb{ background: var(--scrollbar); border-radius: 5px; background-clip: padding-box; border: 2px solid transparent; }

  /* ---------- 全体レイアウト(デスクトップ: 3ペイン) ---------- */
  .app-shell{
    display: flex;
    height: 100vh;
    height: 100dvh;
  }
  .pane-sidebar{
    flex: 0 0 232px;
    background: var(--sidebar-bg);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    border-right: 1px solid var(--line);
    padding: 18px 12px 16px;
    display: flex;
    flex-direction: column;
  }
  .pane-list{
    flex: 0 0 340px;
    background: var(--list-bg);
    border-right: 1px solid var(--line);
    min-width: 280px;
  }
  .pane-detail{
    flex: 1 1 auto;
    background: var(--detail-bg);
    min-width: 340px;
  }
  .pane-list.is-wide{ flex: 1 1 auto; border-right: none; }
  .pane-detail.is-hidden{ display: none; }

  /* ---------- モバイル(1ペインずつ切替) ---------- */
  @media (max-width: 860px){
    .app-shell{ display:block; height:auto; min-height: 100vh; min-height: 100dvh; overflow: visible; }
    body{ overflow: visible; }
    .pane{ width:100%; height:auto; overflow:visible; }
    .pane-sidebar, .pane-list, .pane-detail{
      display:none; border-right:none; flex:none; min-width:0;
      -webkit-backdrop-filter:none; backdrop-filter:none;
    }
    .app-shell[data-mobile-screen="sidebar"] .pane-sidebar{ display:flex; background:var(--sidebar-bg-solid); min-height:100vh; min-height:100dvh; }
    .app-shell[data-mobile-screen="list"] .pane-list{ display:block; min-height:100vh; min-height:100dvh; }
    .app-shell[data-mobile-screen="detail"] .pane-detail{ display:block; min-height:100vh; min-height:100dvh; }
    .pane-list.is-wide{ border-right:none; }
    .mobile-only{ display:revert !important; }
    .mobile-only-hide{ display:none !important; }
  }
  .mobile-only{ display:none; }

  /* ---------- サイドバー ---------- */
  .brand{ padding: 6px 8px 16px; }
  .brand h1{ font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .brand .brand-sub{ font-size: 11.5px; color: var(--text-2); margin-top: 5px; line-height: 1.6; }
  .brand .brand-updated{ font-size: 10.5px; color: var(--text-3); margin-top: 7px; }

  .search-field{
    display:flex; align-items:center; gap:6px;
    background: var(--input-bg);
    border-radius: var(--radius-sm);
    padding: 7px 10px;
    margin-bottom: 14px;
  }
  .search-field svg{ flex-shrink:0; opacity:0.55; }
  .search-field input{
    border:none; background:none; outline:none; width:100%;
    font-size: 13px; color: var(--text-1);
  }
  .search-field input::placeholder{ color: var(--text-3); }
  .search-field kbd{ flex-shrink:0; }
  @media (max-width: 860px){
    .search-field kbd{ display:none; }
  }

  kbd{
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 10.5px; color: var(--text-3);
    background: var(--chip-bg);
    border-radius: 4px; padding: 1.5px 5px;
    line-height: 1.5;
  }

  .nav-group{ margin-bottom: 4px; }
  .nav-row{
    display:flex; align-items:center; gap:9px;
    width:100%; text-align:left; border:none; background:none; cursor:pointer;
    padding: 7px 9px; border-radius: var(--radius-sm);
    color: var(--text-1); font-size: 13px;
    margin-bottom: 1px;
  }
  .nav-row:hover{ background: var(--row-hover); }
  .nav-row.active{ background: var(--row-selected); color:var(--chip-active-text); font-weight: 600; }
  .nav-row .nav-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; background:var(--text-3); }
  .nav-row .nav-label{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav-row .nav-count{ font-size:11.5px; color: var(--text-3); flex-shrink:0; }
  .nav-row .nav-flag{ width:6px; height:6px; border-radius:50%; background: var(--cat-incident); flex-shrink:0; }

  .sidebar-footer{
    margin-top: auto;
    padding: 10px 8px 2px;
    font-size: 10.5px;
    line-height: 1.6;
    color: var(--text-3);
    border-top: 1px solid var(--line-soft);
  }
  @media (max-width: 860px){
    .sidebar-footer{ margin-top: 28px; }
  }

  /* ---------- ツールバー(各ペイン共通の上部) ---------- */
  .toolbar{
    display:flex; align-items:center; gap: 10px;
    height: 52px; flex-shrink:0;
    padding: 0 16px;
    border-bottom: 1px solid var(--line);
    position: sticky; top:0;
    background: inherit;
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    z-index: 2;
  }
  .toolbar .back-btn{
    border:none; background:none; cursor:pointer; color: var(--text-1);
    font-size: 14px; padding: 6px 4px 6px 0; display:flex; align-items:center; gap:2px;
    flex-shrink:0;
  }
  .toolbar .toolbar-title{ min-width:0; }
  .toolbar .toolbar-title h2{ font-size: 15px; font-weight: 600; letter-spacing: -0.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .toolbar .toolbar-sub{ font-size: 11px; color: var(--text-2); margin-top:1px; }

  .pane-body{ padding: 14px 16px 40px; }

  /* ---------- バナー ---------- */
  .attention-line{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding: 0 0 15px; margin-bottom:18px; border-bottom:1px solid var(--line);
  }
  .attention-line .attention-copy{ font-size:12.5px; color:var(--text-2); }
  .attention-line .attention-copy strong{ color:var(--text-1); font-weight:600; }
  .attention-line .attention-copy .attention-dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--cat-candidate); margin:0 7px 1px 0; }
  .attention-line button{ border:none; background:var(--chip-active-text); color:white; padding:5px 9px; border-radius:5px; font-size:11px; font-weight:500; cursor:pointer; white-space:nowrap; }
  /* ---------- 概要ダッシュボード ---------- */
  .stat-grid{ display:grid; grid-template-columns: repeat(3, 1fr); margin-bottom: 22px; border-bottom:1px solid var(--line); }
  .stat-card{
    border:none; border-radius:0; border-right:1px solid var(--line);
    padding: 4px 14px 15px; background:transparent; cursor:pointer; text-align:left;
  }
  .stat-card:last-child{ border-right:none; }
  .stat-card:hover{ background: var(--row-hover); }
  .stat-card .stat-num{ font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
  .stat-card .stat-label{ font-size: 11.5px; color: var(--text-2); margin-top: 3px; display:flex; align-items:center; gap:5px; }

  .section-heading{
    font-size: 11px; font-weight: 600; color: var(--text-2);
    text-transform: uppercase; letter-spacing: 0.03em;
    margin: 4px 0 8px;
  }

  /* ---------- 検索・タグ絞り込みチップ ---------- */
  .chip-row{ display:flex; flex-wrap:wrap; gap:14px; margin-bottom: 14px; border-bottom:1px solid var(--line-soft); }
  .chip{
    font-size: 11.5px; padding: 0 0 6px; border-radius: 0;
    border: none; border-bottom:2px solid transparent; background:transparent; color: var(--text-2); cursor:pointer;
  }
  .chip.active{ background: var(--chip-active-bg); border-bottom-color:var(--chip-active-text); color: var(--chip-active-text); font-weight:600; }
  .filter-label{ font-size: 10.5px; font-weight:600; color: var(--text-3); margin-bottom:5px; }

  .filter-toggle{
    display:block; border:none; background:none; cursor:pointer;
    font-size: 11.5px; color: var(--text-2); padding: 5px 0 10px; text-align:left;
  }
  .filter-toggle:hover{ color: var(--text-1); }

  /* ---------- リスト行 ---------- */
  .row-list{ }
  .row-item{
    display:flex; align-items:center; gap:10px;
    width:100%; text-align:left; border:none; background:none; cursor:pointer;
    padding: 11px 16px; border-bottom: 1px solid var(--line-soft);
  }
  .row-item:hover{ background: var(--row-hover); }
  .row-item.selected{ background: var(--row-selected); box-shadow:inset 3px 0 0 var(--chip-active-text); }
  .row-item.kbd-focus{ outline: 2px solid var(--chip-active-text); outline-offset: -2px; }
  .row-item .row-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .row-item .row-main{ flex:1; min-width:0; }
  .row-item .row-title{
    font-size: 13.5px; font-weight: 500; color: var(--text-1);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .row-item .row-sub{
    font-size: 12px; color: var(--text-2); margin-top: 2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .row-item .row-meta{ flex-shrink:0; text-align:right; }
  .row-item .row-date{ font-size: 11px; color: var(--text-3); white-space:nowrap; }
  .row-item .row-chev{ color: var(--text-3); font-size: 13px; flex-shrink:0; margin-left:2px; }
  .row-item .row-value{ font-size: 12.5px; color: var(--text-2); flex-shrink:0; }

  .load-more-row{
    display:block; width:100%; text-align:center; border:none; background:none; cursor:pointer;
    padding: 12px; font-size: 12.5px; color: var(--text-2);
  }
  .load-more-row:hover{ text-decoration: underline; }

  .empty-pane{
    display:flex; align-items:center; justify-content:center;
    height: calc(100% - 52px); color: var(--text-3); font-size: 13px; text-align:center; padding: 20px;
  }
  .empty-inline{ color: var(--text-3); font-size: 12.5px; padding: 30px 16px; text-align:center; }

  /* ---------- 詳細ペイン ---------- */
  .detail-header{ margin-bottom: 14px; }
  .detail-header h2{ font-size: 25px; font-weight: 600; letter-spacing: -0.035em; line-height:1.28; }
  .detail-meta-row{
    display:flex; flex-wrap:wrap; align-items:center; gap: 8px;
    margin-top: 8px; font-size: 12px; color: var(--text-2);
  }
  .detail-meta-row .dot-sep{ color: var(--text-3); }
  .filename-tag{ font-size: 11px; color: var(--text-3); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .gh-link{ color: var(--text-2); text-decoration:none; display:inline-flex; align-items:center; gap:3px; }
  .gh-link:hover{ color: var(--text-1); text-decoration:underline; }

  /* ---------- 使い方(ヘルプ) ---------- */
  .help-block{ margin-bottom: 26px; }
  .help-block h3{ font-size: 14px; font-weight:600; margin-bottom: 8px; }
  .help-block p{ font-size: 13px; line-height: 1.75; color: var(--text-2); margin-bottom: 8px; }
  .help-block ul, .help-block ol{ padding-left: 1.2em; font-size: 13px; line-height: 1.85; color: var(--text-2); }
  .help-block li{ margin-bottom: 2px; }
  .help-flow{
    display:flex; flex-wrap:wrap; align-items:center; gap: 6px;
    font-size: 12.5px; color: var(--text-1); margin-bottom: 8px;
  }
  .help-flow .flow-step{
    background: var(--chip-bg); border-radius: var(--radius-sm); padding: 5px 10px;
  }
  .help-flow .flow-arrow{ color: var(--text-3); }
  .shortcut-table{ width:100%; border-collapse: collapse; font-size: 13px; }
  .shortcut-table tr{ border-bottom: 1px solid var(--line-soft); }
  .shortcut-table td{ padding: 7px 4px; color: var(--text-2); }
  .shortcut-table td:first-child{ width: 130px; white-space:nowrap; }
  .dir-tree{
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
    line-height: 1.85; color: var(--text-2); white-space:pre; overflow-x:auto;
    background: var(--chip-bg); border-radius: var(--radius-md); padding: 12px 14px;
  }

  .badge{ display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:0; border-radius:0; background:transparent; color:var(--text-2); }
  .badge.tone-good{ color: var(--cat-rule); }
  .badge.tone-warn{ color: var(--cat-incident); }
  .badge .badge-dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }

  .tag-row{ display:flex; flex-wrap:wrap; gap:9px; margin-top: 11px; }
  .tag-row > * + *::before{ content:'·'; color:var(--text-3); margin-right:9px; }
  .pill{ font-size:10.5px; padding:0; border-radius:0; background:transparent; color:var(--text-2); }

  .field-block{ margin: 18px 0; }
  .field-block .field-label{
    font-size: 10.5px; font-weight:600; color: var(--text-3);
    letter-spacing: 0; margin-bottom: 6px;
  }
  .field-block .field-text{ font-size: 13.5px; line-height: 1.75; color: var(--text-1); word-break: break-word; }

  .fulltext-block{
    margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line);
    font-size: 13px; line-height: 1.85; word-break: break-word;
    color: var(--text-1);
  }
  .md-p{ margin: 0 0 12px; }
  .md-p:last-child{ margin-bottom:0; }
  .md-h{ font-size: 12px; font-weight:600; color: var(--text-2); margin: 18px 0 8px; }
  .md-h:first-child{ margin-top:0; }

  code{
    background: var(--chip-bg); border-radius: 4px; padding: 1px 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
  }

  /* ---------- macOS window pass ---------- */
  :root{
    --page-bg:#e7e7ea;
    --sidebar-bg:rgba(246,246,248,.88);
    --list-bg:#fbfbfc;
    --detail-bg:#fff;
    --row-selected:#dbe9ff;
    --chip-active-text:#007aff;
    --line:rgba(60,60,67,.16);
    --line-soft:rgba(60,60,67,.10);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --page-bg:#151517;
      --sidebar-bg:rgba(38,38,41,.90);
      --list-bg:#1f1f22;
      --detail-bg:#1e1e20;
      --row-selected:#164d8a;
      --chip-active-text:#0a84ff;
      --line:rgba(255,255,255,.13);
      --line-soft:rgba(255,255,255,.09);
    }
  }
  body{
    display:block;
    padding:0;
    background:var(--page-bg);
  }
  .app-window{
    width:100%;
    height:100vh;
    height:100dvh;
    min-height:0;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background:var(--detail-bg);
  }
  .window-titlebar{
    height:44px;
    flex:none;
    display:grid;
    grid-template-columns:minmax(0, 1fr) auto;
    align-items:center;
    padding:0 18px;
    border-bottom:1px solid var(--line);
    background:var(--sidebar-bg);
  }
  .window-title{text-align:start;font-size:13px;font-weight:600;letter-spacing:-.01em;}
  .window-status{justify-self:end;display:flex;align-items:center;gap:6px;color:var(--text-2);font-size:11px;white-space:nowrap;}
  .window-status i{width:7px;height:7px;border-radius:50%;background:#30b262;}
  .app-shell{height:auto;min-height:0;flex:1;}
  .pane-sidebar{flex:0 0 clamp(204px, 18vw, 264px);padding:15px 9px;background:var(--sidebar-bg);}
  .pane-list{flex:0 1 clamp(300px, 30vw, 438px);background:var(--list-bg);}
  .pane-detail{background:var(--detail-bg);}
  .brand{padding:3px 9px 15px;}
  .brand h1{font-size:13px;letter-spacing:-.01em;}
  .brand .brand-sub{margin-top:3px;font-size:11px;line-height:1.45;}
  .brand .brand-updated{margin-top:5px;font-size:10px;}
  .search-field{height:30px;margin:0 8px 14px;padding:0 8px;border-radius:6px;background:rgba(118,118,128,.12);}
  .nav-row{min-height:29px;padding:0 9px;border-radius:5px;font-size:13px;}
  .nav-row.active{background:var(--row-selected);color:var(--chip-active-text);}
  .nav-section-label{margin:15px 9px 5px;color:var(--text-3);font-size:10px;font-weight:600;letter-spacing:.04em;}
  .nav-group:first-of-type .nav-section-label{margin-top:4px;}
  .nav-icon{width:15px;height:15px;flex:none;color:var(--text-2);stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .nav-row.active .nav-icon{color:currentColor;}
  .nav-row .nav-flag{margin-left:2px;}
  .nav-row .nav-count{font-size:11px;}
  .sidebar-footer{border-top:0;padding:8px 9px 1px;font-size:10px;}
  .toolbar{height:52px;padding:0 16px;border-bottom:1px solid var(--line);background:inherit;}
  .toolbar .toolbar-title h2{font-size:20px;letter-spacing:-.04em;}
  .toolbar .toolbar-sub{margin-top:2px;font-size:11px;}
  .pane-body{padding:18px 16px 34px;}
  .attention-line{padding:0 0 16px;margin-bottom:20px;}
  .attention-line .attention-copy{font-size:12px;}
  .attention-line button{padding:5px 9px;border-radius:5px;}
  .stat-grid{margin:0 0 24px;border-bottom:1px solid var(--line);}
  .stat-card{padding:3px 14px 16px;border:0;border-right:1px solid var(--line);background:transparent;}
  .stat-card:last-child{border-right:0;}
  .stat-card .stat-num{font-size:26px;font-weight:600;letter-spacing:-.04em;}
  .section-heading{margin:0 0 7px;font-size:10px;letter-spacing:.04em;}
  .filter-toggle{padding:1px 0 11px;}
  .chip-row{gap:15px;margin-bottom:14px;border-bottom:1px solid var(--line-soft);}
  .chip{padding:0 0 6px;border-radius:0;border-bottom:2px solid transparent;background:transparent;}
  .chip.active{border-bottom-color:var(--chip-active-text);background:transparent;color:var(--chip-active-text);}
  .row-item{min-height:60px;padding:11px 16px;border-bottom:1px solid var(--line-soft);transition:background .14s ease;}
  .row-item.selected{background:var(--row-selected);box-shadow:inset 3px 0 0 var(--chip-active-text);}
  .row-item.kbd-focus{outline:2px solid var(--chip-active-text);outline-offset:-2px;}
  .row-item .row-title{font-size:12.5px;font-weight:600;}
  .row-item .row-sub{font-size:11px;}
  .row-item .row-date{font-size:10px;}
  .load-more-row{padding:14px;color:var(--chip-active-text);}
  .detail-header{margin:7px 0 18px;}
  .detail-header h2{font-size:27px;letter-spacing:-.045em;line-height:1.2;}
  .detail-meta-row{gap:7px;margin-top:12px;font-size:11px;}
  .tag-row{gap:9px;margin-top:12px;}
  .badge,.pill{padding:0;border-radius:0;background:transparent;font-size:10.5px;}

<script>
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}

const CAT_LABEL = {rules: 'ルール(確定)', candidates: '候補', incidents: '事例ログ', archived: 'アーカイブ', external_skill_imports: '外部Skill導入記録'};

const CAT_COLOR = {rules: 'var(--cat-rule)', candidates: 'var(--cat-candidate)', incidents: 'var(--cat-incident)', archived: 'var(--cat-archive)', external_skill_imports: 'var(--cat-external)'};
const NAV_SECTIONS = ['overview', 'rules', 'candidates', 'incidents', 'skills', 'history'];
const NUMBER_KEY_SECTIONS = ['overview', 'rules', 'candidates', 'incidents', 'skills', 'history'];
const WIDE_SECTIONS = ['overview', 'help'];
const PAGE_SIZE = 8;
const GITHUB_REPO_URL = 'https://github.com/Hakushukassai/ai-knowledge-base';

let currentListRows = [];
let focusedRowIndex = -1;

  return `${GITHUB_REPO_URL}/blob/master/${dir}/${filename}`;
}
function githubSkillUrl(folderName, retired){
  const dir = retired ? 'claude-config/skills-archive' : 'claude-config/skills';
  return `${GITHUB_REPO_URL}/blob/master/${dir}/${folderName}/SKILL.md`;
}

function goSection(section){
  route = {section, detail: null};
  activeTag = null; activeProject = null; searchQuery = ''; filtersOpen = null;
  renderApp();
}
function selectItem(cat, filename){ route.detail = {kind:'item', cat, filename}; renderApp(); }
function selectSkill(name, retired){ route.detail = {kind:'skill', name, retired: !!retired}; renderApp(); }

function backToList(){ route.detail = null; renderApp(); }
function backToHome(){ route = {section:'overview', detail:null}; searchQuery=''; renderApp(); }

/* ---------- キーボード操作 ---------- */
function focusSearch(){
  const input = document.querySelector('.search-field input');
  if (input) input.focus();
}
function updateFocusVisual(){
  currentListRows.forEach((row, i) => row.classList.toggle('kbd-focus', i === focusedRowIndex));
  if (focusedRowIndex >= 0 && currentListRows[focusedRowIndex]){
    currentListRows[focusedRowIndex].scrollIntoView({block: 'nearest'});
  }
}
function moveListFocus(delta){
  if (currentListRows.length === 0) return;
  if (focusedRowIndex === -1) focusedRowIndex = delta > 0 ? 0 : currentListRows.length - 1;
  else focusedRowIndex = Math.max(0, Math.min(currentListRows.length - 1, focusedRowIndex + delta));
  updateFocusVisual();
}
function activateFocusedRow(){
  if (focusedRowIndex >= 0 && currentListRows[focusedRowIndex]) currentListRows[focusedRowIndex].click();
}

document.addEventListener('keydown', (e) => {
  const active = document.activeElement;
  const tag = active ? active.tagName : '';
  const inTextInput = tag === 'INPUT' || tag === 'TEXTAREA';

  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    focusSearch();
    return;
  }
  if (e.key === 'Escape'){
    if (inTextInput){ active.blur(); return; }
    if (route.detail){ backToList(); return; }
    if (searchQuery.trim()){ searchQuery = ''; renderApp(); return; }
    if (route.section !== 'overview'){ backToHome(); }
    return;
  }
  if (inTextInput) return;

  if (e.key === '/'){
    e.preventDefault();
    focusSearch();
    return;
  }
  if (e.key === '?'){
    e.preventDefault();
    goSection('help');
    return;
  }
  if (/^[1-6]$/.test(e.key) && !e.metaKey && !e.ctrlKey && !e.altKey){
    goSection(NUMBER_KEY_SECTIONS[Number(e.key) - 1]);
    return;
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    moveListFocus(e.key === 'ArrowDown' ? 1 : -1);
    return;
  }
  if (e.key === 'Enter'){
    activateFocusedRow();
  }
});

/* ---------- 日付フォーマット ---------- */
function parseDate(dateStr){
  if (!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  return isNaN(d) ? null : d;
}
function formatDateShort(dateStr, daysOld){
  const d = parseDate(dateStr);
  if (!d) return '';
  if (daysOld === 0) return '今日';
  if (daysOld === 1) return '昨日';
  const now = new Date();
  const sameYear = d.getFullYear() === now.getFullYear();
  return sameYear
    ? `${d.getMonth()+1}/${d.getDate()}`
    : `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
}
function formatDateLong(dateStr){
  const d = parseDate(dateStr);
  if (!d) return null;
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

/* ---------- frontmatter(key: value行)を除いた本文 ---------- */
function cleanBody(content){
  const lines = (content || '').split('\n');
  let i = 0;
  if (lines[i] && lines[i].startsWith('# ')) i++;
  while (i < lines.length && lines[i].trim() === '') i++;
  while (i < lines.length){
    const line = lines[i];
    if (line.trim() === ''){ i++; continue; }
    if (/^[a-zA-Z_]+:\s?/.test(line)){ i++; continue; }
    break;
  }
  return lines.slice(i).join('\n').trim();
}

/* ---------- 簡易Markdown整形(見出し・コード・太字のみ) ---------- */
function renderMarkdownLite(text){
  const esc = escapeHtml(text || '');
  let html = esc
    .replace(/^### (.*)$/gm, '<h4 class="md-h">$1</h4>')
    .replace(/^## (.*)$/gm, '<h4 class="md-h">$1</h4>')
    .replace(/^# (.*)$/gm, '<h4 class="md-h">$1</h4>');
  html = html
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return html.split(/\n{2,}/).map(block => {
    const t = block.trim();
    if (!t) return '';
    if (/^<h4/.test(t)) return t;
    return `<p class="md-p">${t.replace(/\n/g, '<br>')}</p>`;
  }).join('');
}

/* ---------- 行・リストの共通パーツ ---------- */
function makeRow({title, sub, date, daysOld, value, dotColor, selected, onClick}){
  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'row-item' + (selected ? ' selected' : '');
  const dot = dotColor ? `<span class="row-dot" style="background:${dotColor}"></span>` : '';
  const dateStr = date ? formatDateShort(date, daysOld) : '';
  row.innerHTML = `
    ${dot}
    <div class="row-main">
      <div class="row-title">${escapeHtml(title)}</div>
      ${sub ? `<div class="row-sub">${escapeHtml(sub)}</div>` : ''}
    </div>
    <div class="row-meta">
      ${dateStr ? `<div class="row-date">${escapeHtml(dateStr)}</div>` : ''}
      ${value !== undefined ? `<span class="row-value">${escapeHtml(String(value))}</span>` : ''}
    </div>
    <span class="row-chev mobile-only">›</span>
  `;
  row.onclick = onClick;
  return row;
}

function makeRowList(rows, emptyText){
  const wrap = document.createElement('div');
  wrap.className = 'row-list';
  if (rows.length === 0){
    wrap.innerHTML = `<div class="empty-inline">${escapeHtml(emptyText || 'まだありません')}</div>`;
    currentListRows = [];
    return wrap;
  }
  const state = {shown: PAGE_SIZE};
  function paint(){
    wrap.innerHTML = '';
    const visible = rows.slice(0, state.shown);
    visible.forEach(r => wrap.appendChild(r));
    currentListRows = visible;
    updateFocusVisual();
    if (rows.length > state.shown){
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'load-more-row';
      btn.textContent = `さらに${rows.length - state.shown}件を表示`;
      btn.onclick = () => { state.shown += PAGE_SIZE * 2; paint(); };
      wrap.appendChild(btn);
    }
  }
  paint();
  return wrap;
}

function toolbar({title, sub, showBack, onBack}){
  const bar = document.createElement('div');
  bar.className = 'toolbar';
  if (showBack){
    const back = document.createElement('button');
    back.className = 'back-btn mobile-only';
    back.innerHTML = '‹ 戻る';
    back.onclick = onBack;
    bar.appendChild(back);
  }
  const titleBox = document.createElement('div');
  titleBox.className = 'toolbar-title';
  titleBox.innerHTML = `<h2>${escapeHtml(title)}</h2>${sub ? `<div class="toolbar-sub">${escapeHtml(sub)}</div>` : ''}`;
  bar.appendChild(titleBox);
  return bar;
}

/* ---------- 検索 ---------- */
function searchAll(query){
  const q = query.toLowerCase();
  const results = [];
  ['rules', 'candidates', 'incidents', 'archived', 'external_skill_imports'].forEach(cat => {
    (statsData.items[cat] || []).forEach(item => {
      const haystack = [item.title, item.content, ...(item.tags || [])].join(' ').toLowerCase();
      if (haystack.includes(q)) results.push({cat, item});
    });
  });
  return results;
}

function renderOverview(container){
  const attention = [];
  if (statsData.promotion_ready_count > 0) attention.push(`${statsData.promotion_ready_count}件の昇格候補`);
  if (statsData.merge_suggestions) attention.push('統合候補');
  if (statsData.stale_count > 0) attention.push(`${statsData.stale_count}件の見直し候補`);
  if (attention.length > 0){
    const line = document.createElement('div');
    line.className = 'attention-line';
    line.innerHTML = `<div class="attention-copy"><span class="attention-dot"></span><strong>次の判断</strong>　${escapeHtml(attention.join('・'))}があります</div><button type="button">候補を見る</button>`;
    line.querySelector('button').onclick = () => goSection('candidates');
    container.appendChild(line);
  }

  const grid = document.createElement('div');
  grid.className = 'stat-grid';
  [['rules','ルール(確定)'], ['candidates','候補'], ['incidents','事例ログ']].forEach(([cat, label]) => {
    const card = document.createElement('button');
    card.type = 'button';

      <div class="stat-num">${statsData[cat].count}</div>

    card.onclick = () => goSection(cat);

  const heading = document.createElement('div');

  const history = [...(statsData.history || [])].reverse().slice(0, 6);

      <li><code>/exit</code> — セッションを終了する(自動でHANDOFF生成・記録・pushまで行われる)</li>
      <li><code>/clear</code> — 会話をリセットして終了する(pushまでの流れは<code>/exit</code>と同じ)</li>
    </ul>
    <p style="margin-top:10px">新しいパソコンでのセットアップは <code>bash ~/knowledge-base/claude-config/install.sh</code> を実行 → <code>gh auth login</code> の2ステップです。詳細は <a class="gh-link" href="${GITHUB_REPO_URL}/blob/master/claude-config/SETUP.md" target="_blank" rel="noopener">SETUP.md ↗</a></p>
    <p style="margin-top:6px">外部Skillを追加する時の安全な手順は <a class="gh-link" href="${GITHUB_REPO_URL}/blob/master/EXTERNAL-SKILL-GUIDE.md" target="_blank" rel="noopener">EXTERNAL-SKILL-GUIDE.md ↗</a></p>
  `;
  container.appendChild(block3);

  const block4 = document.createElement('div');
  block4.className = 'help-block';
  block4.innerHTML = `
    <h3>キーボードショートカット</h3>
    <table class="shortcut-table">
      <tr><td><kbd>⌘K</kbd> / <kbd>Ctrl K</kbd></td><td>検索にフォーカス</td></tr>
      <tr><td><kbd>/</kbd></td><td>検索にフォーカス(入力中でない時)</td></tr>
      <tr><td><kbd>1</kbd>〜<kbd>6</kbd></td><td>概要・ルール・候補・事例ログ・Skill一覧・更新履歴へ移動</td></tr>
      <tr><td><kbd>↑</kbd> <kbd>↓</kbd></td><td>一覧内の項目を移動</td></tr>
      <tr><td><kbd>Enter</kbd></td><td>選択中の項目を開く</td></tr>
      <tr><td><kbd>Esc</kbd></td><td>検索欄を閉じる/詳細を閉じる/前の画面に戻る</td></tr>
      <tr><td><kbd>?</kbd></td><td>この使い方画面を開く</td></tr>
    </table>
  `;
  container.appendChild(block4);

  const block5 = document.createElement('div');
  block5.className = 'help-block';
  block5.innerHTML = `
    <h3>定期メンテナンス</h3>
    <ul>
      <li>月1回: <code>PRIVACY-CHECKLIST.md</code> に沿って機密情報が紛れていないか確認</li>
      <li>月1回(同じタイミングで): 候補を一通り眺めて昇格できそうなものがないか検討。「昇格条件クリア」バッジが付いているものは特に優先</li>
      <li><code>SYNC-CONFLICT.md</code> が出たら: 複数PC間の自動pushが競合しているので手動で解決</li>
      <li>統合の提案が出たら: 同じ発見を指す候補が複数ファイルに分かれているので、内容を1つにまとめて片方を削除する</li>
    </ul>
  `;
  container.appendChild(block5);

  const block6 = document.createElement('div');
  block6.className = 'help-block';
  block6.innerHTML = `
    <h3>アーカイブされにくい候補</h3>
    <p>候補は90日動きがないと自動でアーカイブされますが、以下のいずれかに当てはまるものは対象外になります(使われている・確認済みのものを優先的に残す仕組み)。</p>
    <ul>
      <li>人が確認済み(<code>/kb-endorse</code>)</li>
      <li>2回以上観測されている</li>
      <li>2プロジェクト以上で観測されている</li>
      <li>直近90日以内に、後のセッションで参照・活用された実績がある</li>
    </ul>
  `;
  container.appendChild(block6);
}

/* ================= リストペイン ================= */
function itemSubtext(cat, item){
  return (cat === 'rules' ? item.solution_summary : (item.problem_summary || item.solution_summary)) || '';
}

function buildChipRow(labelText, options, active, onSelect){
  const wrap = document.createElement('div');
  const label = document.createElement('div');
  label.className = 'filter-label';
  label.textContent = labelText;
  wrap.appendChild(label);
  const box = document.createElement('div');
  box.className = 'chip-row';
  const allBtn = document.createElement('button');
  allBtn.className = 'chip' + (active === null ? ' active' : '');
  allBtn.textContent = 'すべて';
  allBtn.onclick = () => onSelect(null);
  box.appendChild(allBtn);
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (active === opt ? ' active' : '');
    btn.textContent = opt;
    btn.onclick = () => onSelect(active === opt ? null : opt);
    box.appendChild(btn);
  });
  wrap.appendChild(box);
  return wrap;
}

function renderCategoryListBody(container, cat){
  const allEntries = statsData.items[cat] || [];
  const allTags = [...new Set(allEntries.flatMap(e => e.tags || []))].sort();
  const allProjects = [...new Set(allEntries.flatMap(e => e.projects || []))].sort();

  if (allTags.length > 0 || allProjects.length > 0){
    const open = filtersOpen === null ? !isMobile() : filtersOpen;
    const hasActive = activeTag || activeProject;
    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'filter-toggle';
    toggle.textContent = (open ? '絞り込みを隠す' : '絞り込み') + (hasActive ? `(${[activeTag, activeProject].filter(Boolean).join(' · ')})` : '');
    toggle.onclick = () => { filtersOpen = !open; renderApp(); };
    container.appendChild(toggle);
    if (open){
      if (allTags.length > 0) container.appendChild(buildChipRow('タグ', allTags, activeTag, v => { activeTag = v; renderApp(); }));
      if (allProjects.length > 0) container.appendChild(buildChipRow('プロジェクト', allProjects, activeProject, v => { activeProject = v; renderApp(); }));
    }
  }

  const entries = allEntries.filter(e =>
    (!activeTag || (e.tags || []).includes(activeTag)) &&
    (!activeProject || (e.projects || []).includes(activeProject))
  );

  const selected = route.detail && route.detail.kind === 'item' ? route.detail.filename : null;
  const rows = entries.map(item => makeRow({
    title: item.title,
    sub: itemSubtext(cat, item),
    date: item.date,
    daysOld: item.days_old,
    selected: item.filename === selected,
    dotColor: item.source === 'external' ? 'var(--cat-external)' : (item.stale ? 'var(--cat-incident)' : (cat === 'rules' && item.skill_installed ? 'var(--cat-rule)' : CAT_COLOR[cat])),
    onClick: () => selectItem(cat, item.filename)
  }));
  container.appendChild(makeRowList(rows));
}

function renderSkillsListBody(container){
  const skills = statsData.skills || [];
  const selected = route.detail && route.detail.kind === 'skill' && !route.detail.retired ? route.detail.name : null;
  const rows = skills.map(skill => makeRow({
    title: skill.name,
    sub: skillSubtext(skill),
    value: undefined,
    selected: skill.name === selected,
    dotColor: skill.linked_to_rule ? 'var(--cat-rule)' : 'var(--text-3)',
    onClick: () => selectSkill(skill.name, false)
  }));
  container.appendChild(makeRowList(rows, 'まだSkillはありません'));

  const retired = statsData.retired_skills || [];
  if (retired.length > 0){
    const heading = document.createElement('div');
    heading.className = 'section-heading';
    heading.style.marginTop = '18px';
    heading.textContent = '引退済み';
    container.appendChild(heading);
    const rSelected = route.detail && route.detail.kind === 'skill' && route.detail.retired ? route.detail.name : null;
    const retiredRows = retired.map(skill => makeRow({
      title: skill.name,
      sub: '自動では使われません',
      selected: skill.name === rSelected,
      dotColor: 'var(--text-3)',
      onClick: () => selectSkill(skill.name, true)
    }));
    container.appendChild(makeRowList(retiredRows));
  }
}

function skillSubtext(skill){
  const parts = [`${skill.usage_count}回使用`];
  const bits = Object.entries(skill.effectiveness_summary || {}).map(([k, v]) => `${k}${v}`).join('・');
  if (bits) parts.push(bits);
  return parts.join(' · ');
}

function renderHistoryListBody(container){
  const history = [...(statsData.history || [])].reverse();
  const selected = route.detail && route.detail.kind === 'history' ? route.detail.index : null;
  const rows = history.map((h, i) => makeRow({
    title: h.summary || '(記録なし)',
    date: (h.date || '').slice(0, 10),
    daysOld: null,
    selected: i === selected,
    dotColor: dominantCategory(h) ? CAT_COLOR[dominantCategory(h)] : null,
    onClick: () => selectHistory(i)
  }));
  container.appendChild(makeRowList(rows, '更新履歴はまだありません'));
}

function dominantCategory(h){
  const tags = ((h.summary || '').match(/\[(ルール|候補|事例)\]/g) || []).map(t => t.slice(1, -1));
  const unique = [...new Set(tags)];
  if (unique.length === 1) return {'ルール':'rules', '候補':'candidates', '事例':'incidents'}[unique[0]];
  return null;
}

function renderSearchListBody(container){
  const results = searchAll(searchQuery.trim());
  const selected = route.detail && route.detail.kind === 'item' ? route.detail.filename : null;
  const rows = results.map(({cat, item}) => makeRow({
    title: item.title,
    sub: CAT_LABEL[cat],
    date: item.date,
    daysOld: item.days_old,
    selected: item.filename === selected,
    dotColor: CAT_COLOR[cat],
    onClick: () => selectItem(cat, item.filename)
  }));
  container.appendChild(makeRowList(rows, '見つかりませんでした'));
}

function sectionCountSub(section){
  if (['rules','candidates','incidents','archived','external_skill_imports'].includes(section)){
    const c = statsData[section];
    return `${c.count}件 · ${c.chars.toLocaleString()}文字`;
  }
  if (section === 'skills') return `${(statsData.skills || []).length}件`;
  return '';
}

function renderListPane(){
  const el = document.getElementById('pane-list');
  el.innerHTML = '';
  focusedRowIndex = -1;
  const searching = searchQuery.trim().length > 0;
  const isWide = WIDE_SECTIONS.includes(route.section) && !searching && !route.detail;
  el.classList.toggle('is-wide', isWide);

  const bar = searching
    ? toolbar({title: '検索結果', sub: `「${searchQuery.trim()}」`, showBack: true, onBack: backToHome})
    : toolbar({
        title: isWide ? (route.section === 'help' ? '使い方' : '概要') : CAT_LABEL[route.section] || (route.section === 'skills' ? 'Skill一覧' : route.section === 'history' ? '更新履歴' : ''),
        sub: isWide ? '' : sectionCountSub(route.section),
        showBack: true, onBack: backToHome
      });
  el.appendChild(bar);

  const body = document.createElement('div');
  body.className = 'pane-body';
  el.appendChild(body);

  if (searching){ renderSearchListBody(body); return; }

  switch(route.section){
    case 'overview': renderOverview(body); break;
    case 'help': renderHelp(body); break;
    case 'rules': case 'candidates': case 'incidents': case 'archived': case 'external_skill_imports':
      renderCategoryListBody(body, route.section); break;
    case 'skills': renderSkillsListBody(body); break;
    case 'history': renderHistoryListBody(body); break;
  }
}

/* ================= 詳細ペイン ================= */
function renderItemDetail(container, cat, filename){
  const item = (statsData.items[cat] || []).find(e => e.filename === filename);
  if (!item){ container.innerHTML = '<div class="empty-inline">見つかりませんでした</div>'; return; }

  const header = document.createElement('div');
  header.className = 'detail-header';
  const longDate = formatDateLong(item.date);
  header.innerHTML = `
    <h2>${escapeHtml(item.title)}</h2>
    <div class="detail-meta-row">
      ${longDate ? `<span>${escapeHtml(longDate)} 登録</span>` : ''}
      ${longDate ? '<span class="dot-sep">·</span>' : ''}
      <span class="filename-tag">${escapeHtml(item.filename)}</span>
      <span class="dot-sep">·</span>
      <a class="gh-link" href="${githubItemUrl(cat, item.filename)}" target="_blank" rel="noopener">GitHubで見る ↗</a>
    </div>
  `;
  container.appendChild(header);

  const badges = document.createElement('div');
  badges.className = 'tag-row';
  if (cat === 'rules'){
    if (item.skill_retired){
      badges.innerHTML += `<span class="badge"><span class="badge-dot"></span>Skill引退済み: ${escapeHtml(item.skill_name)}</span>`;
    } else if (item.skill_installed){
      badges.innerHTML += `<span class="badge tone-good"><span class="badge-dot"></span>Skill化済み: ${escapeHtml(item.skill_name)}</span>`;
    } else if (item.skill_name){
      badges.innerHTML += `<span class="badge tone-warn"><span class="badge-dot"></span>Skill未検出: ${escapeHtml(item.skill_name)}</span>`;
    } else {
      badges.innerHTML += `<span class="badge">未Skill化</span>`;
    }
  }
  if (item.stale){
    badges.innerHTML += `<span class="badge tone-warn"><span class="badge-dot"></span>${item.days_old}日間、動きなし</span>`;
  }
  if (cat === 'candidates'){
    if (item.source === 'external'){
      const srcLabel = item.source_url
        ? `<a href="${escapeHtml(item.source_url)}" target="_blank" rel="noopener" style="color:inherit;">外部由来・未検証 ↗</a>`
        : '外部由来・未検証';
      badges.innerHTML += `<span class="badge tone-warn"><span class="badge-dot"></span>${srcLabel}</span>`;
    }
    if (item.promotion_ready){
      badges.innerHTML += `<span class="badge tone-good"><span class="badge-dot"></span>昇格条件クリア</span>`;
    }
    if (item.endorsed){
      badges.innerHTML += `<span class="badge tone-good"><span class="badge-dot"></span>人が確認済み</span>`;
    }
    if (item.observed_count > 1){
      badges.innerHTML += `<span class="badge">観測 ${item.observed_count}回</span>`;
    }
  }
  if (item.reference_count > 0){
    badges.innerHTML += `<span class="badge">参照実績 ${item.reference_count}回</span>`;
  }
  (item.projects || []).forEach(p => badges.innerHTML += `<span class="pill">${escapeHtml(p)}</span>`);
  (item.tags || []).forEach(t => badges.innerHTML += `<span class="pill">${escapeHtml(t)}</span>`);
  if (badges.innerHTML) container.appendChild(badges);

  if (item.problem_summary){
    const block = document.createElement('div');
    block.className = 'field-block';
    block.innerHTML = `<div class="field-label">問題</div><div class="field-text">${renderMarkdownLite(item.problem_summary)}</div>`;
    container.appendChild(block);
  }
  if (item.solution_summary){
    const block = document.createElement('div');
    block.className = 'field-block';
    block.innerHTML = `<div class="field-label">${cat === 'rules' ? 'ルール' : '対応'}</div><div class="field-text">${renderMarkdownLite(item.solution_summary)}</div>`;
    container.appendChild(block);
  }
  if ((item.reference_recent || []).length > 0){
    const block = document.createElement('div');
    block.className = 'field-block';
    block.innerHTML = `<div class="field-label">参照実績(直近${item.reference_recent.length}件)</div><div class="field-text">${item.reference_recent.map(r => `${escapeHtml((r.date||'').slice(0,10))}: ${escapeHtml(r.verdict)}${r.reason ? ' — ' + escapeHtml(r.reason) : ''}`).join('<br>')}</div>`;
    container.appendChild(block);
  }

  const full = document.createElement('div');
  full.className = 'fulltext-block';
  full.innerHTML = renderMarkdownLite(cleanBody(item.content));
  container.appendChild(full);

  const related = findRelatedItems(cat, item);
  if (related.length > 0){
    const heading = document.createElement('div');
    heading.className = 'section-heading';
    heading.style.marginTop = '26px';
    heading.textContent = '関連する' + CAT_LABEL_SHORT[cat];
    container.appendChild(heading);
    const rows = related.map(r => makeRow({
      title: r.title,
      sub: itemSubtext(cat, r),
      date: r.date,
      daysOld: r.days_old,
      dotColor: CAT_COLOR[cat],
      onClick: () => selectItem(cat, r.filename)
    }));
    container.appendChild(makeRowList(rows));
  }
}

function findRelatedItems(cat, item){
  const tags = new Set(item.tags || []);
  if (tags.size === 0) return [];
  return (statsData.items[cat] || [])
    .filter(e => e.filename !== item.filename)
    .map(e => ({ e, overlap: (e.tags || []).filter(t => tags.has(t)).length }))
    .filter(x => x.overlap > 0)
    .sort((a, b) => b.overlap - a.overlap)
    .slice(0, 4)
    .map(x => x.e);
}

function renderSkillDetail(container, name, retired){
  const skill = retired
    ? (statsData.retired_skills || []).find(s => s.name === name)
    : (statsData.skills || []).find(s => s.name === name);
  if (!skill){ container.innerHTML = '<div class="empty-inline">見つかりませんでした</div>'; return; }

  const header = document.createElement('div');
  header.className = 'detail-header';
  header.innerHTML = `
    <h2>${escapeHtml(skill.name)}</h2>
    <div class="detail-meta-row">
      <span class="filename-tag">${escapeHtml(skill.folder_name)}/SKILL.md</span>
      <span class="dot-sep">·</span>
      <a class="gh-link" href="${githubSkillUrl(skill.folder_name, retired)}" target="_blank" rel="noopener">GitHubで見る ↗</a>
    </div>
  `;
  container.appendChild(header);

  const badges = document.createElement('div');
  badges.className = 'tag-row';
  if (retired){
    badges.innerHTML = `<span class="badge tone-warn"><span class="badge-dot"></span>引退済み(自動では使われません)</span>`;
  } else {
    badges.innerHTML = skill.linked_to_rule
      ? `<span class="badge tone-good"><span class="badge-dot"></span>ルールと紐付け済み</span>`
      : `<span class="badge">ルール未紐付け</span>`;
  }
  container.appendChild(badges);

  if (!retired){
    const usage = document.createElement('div');
    usage.className = 'field-block';
    usage.innerHTML = `<div class="field-label">使用回数</div><div class="field-text">${skill.usage_count}回</div>`;
    container.appendChild(usage);

    const effRecent = skill.effectiveness_recent || [];
    if (effRecent.length > 0){
      const eff = document.createElement('div');
      eff.className = 'field-block';
      eff.innerHTML = `<div class="field-label">評価(直近${effRecent.length}件)</div><div class="field-text">${effRecent.map(r => `${escapeHtml((r.date||'').slice(0,10))}: ${escapeHtml(r.verdict)}${r.reason ? ' — ' + escapeHtml(r.reason) : ''}`).join('<br>')}</div>`;
      container.appendChild(eff);
    }
  }

  const desc = document.createElement('div');
  desc.className = 'field-block';
  desc.innerHTML = `<div class="field-label">${retired ? '発動条件・説明(引退前)' : '発動条件・説明'}</div><div class="field-text">${escapeHtml(skill.description)}</div>`;
  container.appendChild(desc);
}

function renderHistoryDetail(container, index){
  const history = [...(statsData.history || [])].reverse();
  const h = history[index];
  if (!h){ container.innerHTML = '<div class="empty-inline">見つかりませんでした</div>'; return; }

  const header = document.createElement('div');
  header.className = 'detail-header';
  const d = new Date(h.date);
  header.innerHTML = `<h2>${escapeHtml(h.summary || '(記録なし)')}</h2><div class="detail-meta-row"><span>${escapeHtml(d.toLocaleString('ja-JP'))}</span></div>`;
  container.appendChild(header);

  const block = document.createElement('div');
  block.className = 'field-block';
  block.innerHTML = `
    <div class="field-label">その時点の累計</div>
    <div class="field-text">ルール ${h.rules_count}件・候補 ${h.candidates_count}件・事例 ${h.incidents_count}件<br>合計 ${h.total_chars.toLocaleString()}文字</div>
  `;
  container.appendChild(block);
}

function renderDetailPane(){
  const el = document.getElementById('pane-detail');
  el.innerHTML = '';
  const isWide = WIDE_SECTIONS.includes(route.section) && !searchQuery.trim() && !route.detail;
  el.classList.toggle('is-hidden', isWide);
  if (isWide) return;

  if (!route.detail){
    const bar = toolbar({title: '', showBack: false});
    el.appendChild(bar);
    const empty = document.createElement('div');
    empty.className = 'empty-pane';
    empty.textContent = '項目を選択してください';
    el.appendChild(empty);
    return;
  }

  const bar = toolbar({title: detailTitle(), showBack: true, onBack: backToList});
  el.appendChild(bar);
  const body = document.createElement('div');
  body.className = 'pane-body';
  el.appendChild(body);

  if (route.detail.kind === 'item') renderItemDetail(body, route.detail.cat, route.detail.filename);
  else if (route.detail.kind === 'skill') renderSkillDetail(body, route.detail.name, route.detail.retired);
  else if (route.detail.kind === 'history') renderHistoryDetail(body, route.detail.index);
}

function detailTitle(){
  if (!route.detail) return '';
  if (route.detail.kind === 'item'){
    const item = (statsData.items[route.detail.cat] || []).find(e => e.filename === route.detail.filename);
    return item ? item.title : '詳細';
  }
  if (route.detail.kind === 'skill') return route.detail.name;
  if (route.detail.kind === 'history') return '履歴';
  return '';
}

/* ================= モバイルの画面状態 ================= */
function computeMobileScreen(){
  if (route.detail) return 'detail';
  if (searchQuery.trim()) return 'list';
  if (route.section !== 'overview') return 'list';
  return 'sidebar';
}

/* ================= 全体描画 ================= */
function renderApp(){
  document.getElementById('app').dataset.mobileScreen = computeMobileScreen();
  renderSidebar();
  renderListPane();
  renderDetailPane();
}

window.addEventListener('resize', () => { renderApp(); });

async function load(){
  let data = window.STATS_DATA;
  if (!data){
    try{
      const res = await fetch('stats.json?_=' + Date.now());
      data = await res.json();
    }catch(e){
      document.getElementById('pane-sidebar').innerHTML = '<div class="empty-inline">データを読み込めませんでした。scripts/generate_stats.sh を一度実行してください。</div>';
      return;
    }
  }
  statsData = data;
  const status = document.getElementById('window-status');
  if (status && statsData.generated_at){
    const updated = new Date(statsData.generated_at).toLocaleString('ja-JP', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});
    status.innerHTML = `<i></i>更新 ${escapeHtml(updated)}`;
  }
  renderApp();
}
load();
</script>
